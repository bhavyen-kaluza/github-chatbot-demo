<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cortex GitHub demo</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1f2328; --muted: #656d76; --line: #d8dee4;
    --accent: #1f6feb; --accent-ink: #ffffff; --ok: #1a7f37; --warn: #9a6700; --bad: #cf222e;
    --user: #ddf4ff; --chip: #eef1f4; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --panel: #161b22; --ink: #e6edf3; --muted: #8d96a0; --line: #30363d; --accent: #4493f8; --user: #12263f; --chip: #21262d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 1; }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--chip); font-size: 13px; color: var(--muted); }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .pill.on .dot { background: var(--ok); }
  .pill.off .dot { background: var(--bad); }
  button, .btn { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 7px 14px; border-radius: 8px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  button:disabled { opacity: .5; cursor: default; }
  main { flex: 1; width: 100%; max-width: 860px; margin: 0 auto; padding: 20px 20px 140px; }
  .notice { border: 1px solid var(--line); border-left: 4px solid var(--warn); background: var(--panel); padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
  .notice.bad { border-left-color: var(--bad); }
  .msg { display: flex; margin: 12px 0; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 78%; padding: 10px 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); overflow-wrap: anywhere; }
  .msg.user .bubble { background: var(--user); border-color: transparent; }
  .bubble p { margin: 0 0 8px; } .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 4px 0 8px; padding-left: 22px; }
  .bubble h1, .bubble h2, .bubble h3 { font-size: 15px; margin: 10px 0 6px; }
  .bubble code { font-family: var(--mono); font-size: 13px; background: var(--chip); padding: 1px 5px; border-radius: 4px; }
  .bubble pre { background: var(--chip); padding: 10px 12px; border-radius: 8px; overflow-x: auto; }
  .bubble pre code { background: none; padding: 0; }
  .bubble a { color: var(--accent); }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
  .tool { font: 12px/1.3 var(--mono); padding: 4px 8px; border-radius: 6px; background: var(--chip); color: var(--muted); border: 1px solid var(--line); }
  .tool.running { border-color: var(--accent); color: var(--accent); }
  .tool.ok { color: var(--ok); } .tool.err { color: var(--bad); }
  .thinking { color: var(--muted); font-size: 13px; }
  .suggest { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0; }
  .suggest button { border-radius: 999px; font-size: 13px; }
  .intro { color: var(--muted); text-align: center; margin: 48px 0 8px; }
  form { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 14px 20px 18px; }
  .row { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea { flex: 1; resize: none; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); min-height: 44px; max-height: 160px; }
  .foot { max-width: 860px; margin: 8px auto 0; color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; }
  .foot a { color: var(--muted); }
</style>
</head>
<body>
<header>
  <div>
    <h1>Cortex GitHub demo</h1>
    <p>Ask about the repositories your GitHub App token can reach.</p>
  </div>
  <div class="spacer"></div>
  <span class="pill" id="pill"><span class="dot"></span><span id="pill-text">Checking GitHub…</span></span>
  <button id="connect" class="primary" hidden>Connect GitHub</button>
  <button id="disconnect" hidden>Disconnect</button>
</header>

<main>
  <div id="notice" hidden></div>
  <div id="log"></div>
  <div id="empty">
    <p class="intro">Every answer is read live from GitHub, as you, read-only.</p>
    <div class="suggest" id="suggest"></div>
  </div>
</main>

<form id="form">
  <div class="row">
    <textarea id="input" rows="1" placeholder="Ask about a repository…" autofocus></textarea>
    <button type="submit" id="send" class="primary">Send</button>
  </div>
  <div class="foot">
    <span id="model"></span>
    <span><a href="#" id="reset">New conversation</a></span>
  </div>
</form>

<script>
(function () {
  const $ = id => document.getElementById(id)
  const log = $('log'), empty = $('empty'), input = $('input'), sendBtn = $('send'), form = $('form')
  const turns = []   // { role, content } plain text, sent whole on every question
  let busy = false

  // ── connection status ───────────────────────────────────────────────────
  async function refreshStatus() {
    try {
      const s = await (await fetch('/api/github/status')).json()
      const pill = $('pill')
      pill.classList.toggle('on', s.connected)
      pill.classList.toggle('off', !s.connected)
      const hours = s.expiresAt ? ((s.expiresAt - Date.now()) / 3600000).toFixed(1) : null
      $('pill-text').textContent = s.connected ? `GitHub connected as @${s.login}${hours ? ` · token ${hours}h` : ''}` : 'GitHub not connected'
      $('connect').hidden = s.connected
      $('disconnect').hidden = !s.connected
      $('model').textContent = `${s.model}${s.fallbacks ? ' · refusal fallback on' : ''} · read-only GitHub App token`
    } catch {
      $('pill-text').textContent = 'Server unreachable'
    }
  }
  $('connect').onclick = () => { location.href = '/api/github/oauth/start' }
  $('disconnect').onclick = async () => { await fetch('/api/github/disconnect', { method: 'POST' }); refreshStatus() }

  const ERRORS = {
    declined: 'You cancelled on GitHub. Nothing was connected.',
    state: 'That sign-in did not start here. Click Connect GitHub and try again.',
    no_refresh: 'GitHub sent a token that never expires. Switch on "Expire user authorization tokens" in the app settings, then connect again.',
    incorrect_client_credentials: 'GitHub rejected the client id or secret. Check GITHUB_CLIENT_ID and GITHUB_CLIENT_SECRET in .env.',
    redirect_uri_mismatch: 'The callback URL on the GitHub App must be exactly http://localhost:3000/api/github/oauth/callback.',
    bad_verification_code: 'The sign-in code had expired. Click Connect GitHub and try again.',
  }
  const err = new URLSearchParams(location.search).get('github_error')
  if (err) {
    const n = $('notice')
    n.hidden = false
    n.className = 'notice bad'
    n.textContent = `GitHub connection failed: ${ERRORS[err] || err}`
    window.history.replaceState(null, "", "/")
  }

  // ── suggested questions ─────────────────────────────────────────────────
  const SUGGESTIONS = [
    'Which GitHub repositories can I see through Cortex?',
    'What is bhavyen-kaluza/fastify-clone? Languages, branches, tags, what is in the root?',
    'Show me the README of bhavyen-kaluza/portless-clone',
    'What is in docs/cortex-probe in bhavyen-kaluza/ponytail-clone?',
    'What changed in bhavyen-kaluza/fastify-clone in the last month?',
    'Which pull requests are open in bhavyen-kaluza/fastify-clone, and which are drafts or from bots?',
    'What is the kaluza-accelerator/cortex repo about?',
  ]
  for (const q of SUGGESTIONS) {
    const b = document.createElement('button')
    b.type = 'button'
    b.textContent = q
    b.onclick = () => ask(q)
    $('suggest').appendChild(b)
  }

  // ── tiny, safe markdown ─────────────────────────────────────────────────
  const escapeHtml = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
  function inline(s) {
    return s
      .replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`)
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>')
  }
  function markdown(text) {
    const parts = escapeHtml(text).split(/```[\w-]*\n?/)
    let html = ''
    parts.forEach((part, i) => {
      if (i % 2 === 1) { html += `<pre><code>${part.replace(/\n$/, '')}</code></pre>`; return }
      const lines = part.split('\n')
      let list = null, para = []
      const flushPara = () => { if (para.length) { html += `<p>${inline(para.join(' '))}</p>`; para = [] } }
      const flushList = () => { if (list) { html += `</${list}>`; list = null } }
      for (const raw of lines) {
        const line = raw.trimEnd()
        const h = line.match(/^(#{1,3})\s+(.*)/)
        const ul = line.match(/^\s*[-*]\s+(.*)/)
        const ol = line.match(/^\s*\d+[.)]\s+(.*)/)
        if (h) { flushPara(); flushList(); html += `<h${h[1].length + 1}>${inline(h[2])}</h${h[1].length + 1}>` }
        else if (ul || ol) {
          flushPara()
          const kind = ul ? 'ul' : 'ol'
          if (list !== kind) { flushList(); list = kind; html += `<${kind}>` }
          html += `<li>${inline((ul || ol)[1])}</li>`
        }
        else if (line.trim() === '') { flushPara(); flushList() }
        else { flushList(); para.push(line) }
      }
      flushPara(); flushList()
    })
    return html
  }

  // ── rendering ───────────────────────────────────────────────────────────
  function addMessage(role, text) {
    empty.hidden = true
    const wrap = document.createElement('div')
    wrap.className = `msg ${role}`
    const bubble = document.createElement('div')
    bubble.className = 'bubble'
    if (role === 'user') bubble.textContent = text
    else bubble.innerHTML = markdown(text)
    wrap.appendChild(bubble)
    log.appendChild(wrap)
    wrap.scrollIntoView({ block: 'end' })
    return bubble
  }

  function parseSse(buffer, onEvent) {
    const chunks = buffer.split('\n\n')
    const rest = chunks.pop()
    for (const chunk of chunks) {
      let event = 'message', data = ''
      for (const line of chunk.split('\n')) {
        if (line.startsWith('event: ')) event = line.slice(7)
        else if (line.startsWith('data: ')) data += line.slice(6)
      }
      if (data) onEvent(event, JSON.parse(data))
    }
    return rest
  }

  async function ask(question) {
    if (busy || !question.trim()) return
    busy = true
    sendBtn.disabled = true
    input.value = ''
    addMessage('user', question)
    turns.push({ role: 'user', content: question })

    const bubble = addMessage('assistant', '')
    const tools = document.createElement('div')
    tools.className = 'tools'
    const body = document.createElement('div')
    body.innerHTML = '<span class="thinking">Thinking…</span>'
    bubble.append(tools, body)
    let text = ''
    const chips = new Map()

    try {
      const res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: turns }) })
      if (!res.ok) throw new Error((await res.json()).error || `HTTP ${res.status}`)
      const reader = res.body.getReader()
      const decoder = new TextDecoder()
      let buffer = ''
      let failed = null
      const handle = (event, data) => {
        if (event === 'text') { text += data.delta; body.innerHTML = markdown(text) }
        else if (event === 'tool_start') {
          const chip = document.createElement('span')
          chip.className = 'tool running'
          const where = data.input && data.input.name ? ` ${data.input.owner}/${data.input.name}` : ''
          chip.textContent = `⟳ ${data.name}${where}`
          chips.set(data.id, chip)
          tools.appendChild(chip)
        }
        else if (event === 'tool_end') {
          const chip = chips.get(data.id)
          if (!chip) return
          chip.className = `tool ${data.ok ? 'ok' : 'err'}`
          const cost = data.rateLimit ? ` · ${data.rateLimit.cost} pt` : ''
          chip.textContent = `${data.ok ? '✓' : '✗'} ${data.name}${data.ok ? '' : ' · ' + data.code}${cost} · ${(data.ms / 1000).toFixed(1)}s`
        }
        else if (event === 'error') failed = data.message
        else if (event === 'done') { if (data.stopReason === 'refusal') text += '\n\n_(The model declined this request.)_'; if (data.stopReason === 'max_tokens') text += '\n\n_(Answer cut off at the length limit.)_' }
        bubble.parentElement.scrollIntoView({ block: 'end' })
      }
      while (true) {
        const { value, done } = await reader.read()
        if (done) break
        buffer = parseSse(buffer + decoder.decode(value, { stream: true }), handle)
      }
      if (failed) throw new Error(failed)
      body.innerHTML = markdown(text || '(no answer)')
      turns.push({ role: 'assistant', content: text })
    } catch (e) {
      turns.pop()
      body.innerHTML = `<p style="color:var(--bad)">${escapeHtml(e.message)}</p>`
    } finally {
      busy = false
      sendBtn.disabled = false
      input.focus()
      refreshStatus()
    }
  }

  form.onsubmit = e => { e.preventDefault(); ask(input.value) }
  input.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(input.value) } }
  input.oninput = () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 160) + 'px' }
  $('reset').onclick = e => { e.preventDefault(); turns.length = 0; log.innerHTML = ''; empty.hidden = false; input.focus() }

  refreshStatus()
})()
</script>
</body>
</html>
